<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="590b08291eaf7810856a6e6c3e9506ae51ac29da" content="590b08291eaf7810856a6e6c3e9506ae51ac29da" />
  <title>Crypto Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='11486843' data-sdk='show_11486843'></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; min-height: 100vh; overflow-x: hidden; overscroll-behavior: none; }
    input { padding: 8px; font-size: 16px; margin-bottom: 10px; border-radius: 5px; border: none; background: #2a2a2a; color: #fff; width: 100%; }
    .click-button { background: linear-gradient(135deg, #00ffa6, #00c3ff); color: #000; font-weight: bold; padding: 12px 24px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 5px; border: none; transition: all 0.3s ease; touch-action: manipulation; }
    .click-button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 195, 255, 0.4); }
    .click-button:active { transform: translateY(0); }
    .click-button:disabled { background: #555; cursor: not-allowed; transform: none; }
    .ad-button { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; font-weight: bold; padding: 12px 24px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 5px; border: none; transition: all 0.3s ease; touch-action: manipulation; }
    .ad-button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); }
    .ad-button:active { transform: translateY(0); }
    .ad-button:disabled { background: #555; cursor: not-allowed; transform: none; }
    .game-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px; position: relative; z-index: 10; }
    #profilePanel { background-color: #1a1a1a; padding: 15px; border-radius: 12px; box-shadow: 0 0 15px #00c3ff; width: 220px; text-align: left; transition: all 0.3s ease; position: relative; overflow: hidden; }
    #profilePanel div { margin: 8px 0; font-size: 14px; }
    #profilePanel strong { color: #00ffa6; }
    #profilePanel .collapse-arrow { display: none; position: absolute; right: 12px; top: 12px; color: #00c3ff; font-size: 12px; transition: transform 0.3s ease; z-index: 2; width: 20px; height: 20px; line-height: 20px; text-align: center; }
    #profilePanel.expanded .collapse-arrow { transform: rotate(180deg); }
    #hourlyBonus { transition: all 0.3s ease; }
    .bonus-card { background: #1a1a1a; padding: 15px; border-radius: 12px; width: 200px; box-shadow: 0 0 15px #00c3ff; text-align: center; position: relative; }
    .bonus-card h3 { margin: 0 0 10px; font-size: 18px; color: #00ffa6; }
    .bonus-card p { margin: 0 0 10px; font-size: 14px; color: #fff; }
    .bonus-message { font-size: 12px; color: #ffd700; margin-top: 8px; min-height: 18px; transition: opacity 0.3s ease; }
    .main-content { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { margin: 20px 0; font-size: 2.5em; text-shadow: 0 0 10px #00c3ff; }
    #mainButtonContainer { display: flex; justify-content: center; align-items: center; margin: 40px auto; position: relative; width: 350px; height: 350px; max-width: 100%; overflow: hidden; }
    .main-click-button { width: 150px; height: 150px; background: linear-gradient(135deg, #00ffa6, #00c3ff); border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px #00c3ff; transition: all 0.2s ease; outline: none; -webkit-tap-highlight-color: transparent; z-index: 1; touch-action: manipulation; position: relative; will-change: transform; transform-origin: center center; }
    .main-click-button:hover { box-shadow: 0 0 35px #00ffa6; transform: scale(1.05); }
    .main-click-button:active { transform: scale(0.9); box-shadow: 0 0 15px #00c3ff; }
    .main-click-button .icon { font-size: 60px; }
    #secondClickButton { display: none; }
    #secondClickButton.visible { display: flex; }
    #counter { font-size: 36px; margin: 20px 0; font-weight: bold; transition: transform 0.2s ease; text-shadow: 0 0 10px rgba(0, 255, 166, 0.5); }
    #counter.bounce { transform: scale(1.2); }
    #message { margin: 10px 0; color: #ff5555; font-size: 16px; min-height: 24px; }
    #buttonGroup { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
    .progress-container { background-color: #222; border-radius: 10px; height: 12px; width: 140px; margin: 10px auto; overflow: hidden; box-shadow: 0 0 5px #00ffc8; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #00ffc8 0%, #00c3ff 100%); width: 0%; transition: width 0.3s ease-in-out; border-radius: 10px; }
    .panel { display: none; margin-top: 20px; background-color: #1a1a1a; border-radius: 10px; box-shadow: 0 0 10px #00c3ff; padding: 15px; }
    .panel.open { display: block; }
    #tasksList > div { margin-bottom: 10px; padding: 10px; border: 1px solid #00c3ff; border-radius: 8px; background-color: #222; }
    #autoclickerShop { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .booster-card { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 220px; box-shadow: 0 0 10px #00c3ff; text-align: center; }
    .booster-card.premium { border: 2px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); background: linear-gradient(135deg, #1a1a1a 0%, #2a2a1a 100%); position: relative; overflow: hidden; }
    .booster-card.premium::before { content: "BEST VALUE"; position: absolute; top: 10px; right: -30px; background: #ffd700; color: #000; padding: 3px 30px; font-size: 10px; font-weight: bold; transform: rotate(45deg); }
    .booster-card.premium h3 { color: #ffd700; font-size: 22px; }
    .booster-card .price { font-size: 24px; font-weight: bold; margin: 10px 0; color: #00c3ff; }
    .booster-card .feature-list { text-align: left; margin: 15px 0; font-size: 13px; color: #ccc; }
    .booster-card .feature-list div { margin: 5px 0; }
    .booster-card .feature-list i { color: #00ffa6; margin-right: 8px; }
  </style>
</head>
<body>

  <!-- Game UI Header & Panels -->
  <div class="game-header">
    <div id="profilePanel">
      <div class="collapse-arrow"><i class="fas fa-chevron-down"></i></div>
      <div>Игрок: <strong id="userName">Гость</strong></div>
      <div>Уровень: <strong id="userLevel">1</strong></div>
      <div>Кристаллы: <strong id="userCrystals">0</strong> 💎</div>
      <div>Кликов: <strong id="userClicks">0</strong></div>
    </div>
    <div class="bonus-card" id="hourlyBonus">
      <h3>Ежечасный бонус</h3>
      <p id="bonusTimer">Доступен!</p>
      <button class="click-button" id="claimBonusBtn" onclick="claimHourlyBonus()">Забрать</button>
      <div class="bonus-message" id="bonusMessage"></div>
    </div>
  </div>

  <div class="main-content">
    <h1>Crypto Clicker</h1>
    <div id="counter">0 🪙</div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div id="message"></div>

    <div id="mainButtonContainer">
      <button class="main-click-button" id="clickButton" onclick="handleClick(event)">
        <span class="icon">🪙</span>
      </button>
      <button class="main-click-button" id="secondClickButton" onclick="handleClick(event)">
        <span class="icon">⚡</span>
      </button>
    </div>

    <div id="buttonGroup">
      <button class="click-button" onclick="togglePanel('tasksPanel')">Задания</button>
      <button class="click-button" onclick="togglePanel('shopPanel')">Магазин</button>
      <button class="click-button" onclick="togglePanel('minigamesPanel')">Мини-игры</button>
      <button class="ad-button" id="adBtn" onclick="watchAd()">Смотреть рекламу (+50 🪙)</button>
    </div>

    <!-- Panels -->
    <div class="panel" id="tasksPanel">
      <h2>Задания</h2>
      <div id="tasksList"></div>
    </div>

    <div class="panel" id="shopPanel">
      <h2>Магазин Бустеров и Автокликеров</h2>
      <div id="autoclickerShop"></div>
    </div>

    <div class="panel" id="minigamesPanel">
      <h2>Мини-игры</h2>
      <div id="minigamesList">
        <button class="click-button" onclick="playMinigame('Coin Flip')">Монетка</button>
        <button class="click-button" onclick="playMinigame('Wheel of Fortune')">Колесо фортуны</button>
        <button class="click-button" onclick="playMinigame('Dice Roll')">Кости</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== FIREBASE CONFIG & INITIALIZATION ====================
    const firebaseConfig = { 
      apiKey: "AIzaSyDVgvBf_C6dIMtZ4MISwR5YRCBi8_JXinQ", 
      authDomain: "cryptoclickertry.firebaseapp.com", 
      databaseURL: "https://cryptoclickertry-default-rtdb.firebaseio.com", 
      projectId: "cryptoclickertry", 
      storageBucket: "cryptoclickertry.firebasestorage.app", 
      messagingSenderId: "1017002572592", 
      appId: "1:1017002572592:web:e06e5f4ba00017dc1466f5" 
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Player State
    let userId = "guest_" + Math.random().toString(36).substr(2, 9);
    let tgUser = null;
    let score = 0;
    let crystals = 0;
    let level = 1;
    let clicks = 0;
    let firstClickTime = null;
    let firstUpgradeTime = null;
    let sessionStartTime = Date.now();
    let sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);

    // Initialize Telegram WebApp if available
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
      if (tgUser && tgUser.id) {
        userId = "tg_" + tgUser.id;
        document.getElementById('userName').textContent = tgUser.first_name || ("User " + tgUser.id);
      }
    }

    // Error tracking logger
    window.onerror = function(message, source, lineno, colno, error) {
      try {
        db.ref('analytics/errors').push({
          type: error ? error.name : 'UncaughtError',
          message: message,
          source: source,
          line: lineno,
          col: colno,
          stack: error ? error.stack : '',
          userId: userId,
          timestamp: Date.now()
        });
      } catch(e) {}
    };

    // ==================== STATS & DATA COLLECTORS (FOR ADMINPANEL2) ====================
    
    // 1. Visit & Traffic Source Tracking
    function trackVisit() {
      const isTg = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
      const referrer = document.referrer || 'direct';
      
      db.ref('analytics/visits').push({
        userId: userId,
        isTelegram: isTg,
        referrer: referrer,
        timestamp: Date.now()
      });
    }

    // 2. Device, Browser, Language, Timezone, Performance Tracking
    function trackTechnicalMetrics() {
      // Device
      const ua = navigator.userAgent;
      let deviceType = 'desktop';
      if (/Mobi|Android|iPhone/i.test(ua)) deviceType = 'mobile';
      else if (/Tablet|iPad/i.test(ua)) deviceType = 'tablet';

      db.ref('analytics/devices').push({
        userId: userId,
        type: deviceType,
        userAgent: ua,
        timestamp: Date.now()
      });

      // Browser
      let browserName = 'Unknown';
      let browserVer = 'Unknown';
      if (ua.indexOf("Chrome") > -1) { browserName = "Chrome"; browserVer = ua.split("Chrome/")[1]?.split(" ")[0] || ""; }
      else if (ua.indexOf("Safari") > -1) { browserName = "Safari"; browserVer = ua.split("Version/")[1]?.split(" ")[0] || ""; }
      else if (ua.indexOf("Firefox") > -1) { browserName = "Firefox"; browserVer = ua.split("Firefox/")[1]?.split(" ")[0] || ""; }

      db.ref('analytics/browsers').push({
        userId: userId,
        name: browserName,
        version: browserVer,
        timestamp: Date.now()
      });

      // Language & Timezone
      const userLang = navigator.language || 'ru-RU';
      const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

      db.ref('analytics/languages').push({ userId: userId, language: userLang, timestamp: Date.now() });
      db.ref('analytics/timezones').push({ userId: userId, timezone: userTz, timestamp: Date.now() });

      // Performance Page Load Time
      window.addEventListener('load', () => {
        setTimeout(() => {
          const perfData = window.performance.timing;
          const pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
          if (pageLoadTime > 0) {
            db.ref('analytics/performance').push({
              userId: userId,
              load_time: pageLoadTime,
              timestamp: Date.now()
            });
          }
        }, 0);
      });
    }

    // 3. GeoIP & Country/City tracking
    function trackGeography() {
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          if (data && data.country_name) {
            db.ref('analytics/countries').push({ userId: userId, country: data.country_name, timestamp: Date.now() });
          }
          if (data && data.city) {
            db.ref('analytics/cities').push({ userId: userId, city: data.city, timestamp: Date.now() });
          }
        })
        .catch(() => {
          db.ref('analytics/countries').push({ userId: userId, country: 'Unknown', timestamp: Date.now() });
        });
    }

    // 4. Online Presence & Real-time Session Tracking
    function setupPresenceAndSession() {
      const onlineRef = db.ref(`online/${userId}`);
      const sessionRef = db.ref(`sessions/${sessionId}`);
      
      onlineRef.set({
        userId: userId,
        lastSeen: Date.now()
      });
      onlineRef.onDisconnect().remove();

      sessionRef.set({
        userId: userId,
        startTime: sessionStartTime
      });

      // Update presence periodically & record session duration on unload
      const presenceInterval = setInterval(() => {
        onlineRef.update({ lastSeen: Date.now() });
      }, 15000);

      window.addEventListener('beforeunload', () => {
        clearInterval(presenceInterval);
        const duration = Math.round((Date.now() - sessionStartTime) / 1000);
        db.ref('analytics/sessions').push({
          userId: userId,
          duration: duration,
          timestamp: Date.now()
        });
      });
    }

    // 5. Auth Attempt Logging
    function logAuth(type) {
      db.ref('analytics/auth_attempts').push({ userId: userId, timestamp: Date.now() });
      if (type === 'success') {
        db.ref('analytics/auth_success').push({ userId: userId, timestamp: Date.now() });
      } else {
        db.ref('analytics/auth_fails').push({ userId: userId, timestamp: Date.now() });
      }
    }

    // Load User Data & Initialize Database
    async function initUserData() {
      logAuth('success');
      
      const userRef = db.ref(`users/${userId}`);
      const playerRef = db.ref(`player_data/${userId}`);

      const userSnap = await userRef.once('value');
      if (!userSnap.exists()) {
        await userRef.set({
          display_name: tgUser ? (tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "")) : "Гость",
          created_at: new Date().toISOString(),
          tg_id: tgUser ? tgUser.id : null
        });
      }

      const playerSnap = await playerRef.once('value');
      if (playerSnap.exists()) {
        const pData = playerSnap.val();
        score = pData.score || 0;
        crystals = pData.crystals || 0;
        level = pData.level || 1;
        clicks = pData.clicks || 0;
        firstClickTime = pData.firstClickTime || null;
        firstUpgradeTime = pData.firstUpgradeTime || null;
      } else {
        await playerRef.set({
          score: 0,
          crystals: 0,
          level: 1,
          clicks: 0,
          lastActive: Date.now()
        });
      }

      updateUI();
    }

    // Save Data to Firebase
    function savePlayerData() {
      db.ref(`player_data/${userId}`).update({
        score: score,
        crystals: crystals,
        level: level,
        clicks: clicks,
        firstClickTime: firstClickTime,
        firstUpgradeTime: firstUpgradeTime,
        lastActive: Date.now()
      });

      db.ref(`leaderboard/${userId}`).set({
        score: score,
        name: tgUser ? tgUser.first_name : "Гость",
        lastActive: Date.now()
      });
    }

    // ==================== GAME MECHANICS & TRACKING ====================

    function handleClick(e) {
      if (!firstClickTime) {
        firstClickTime = Date.now();
      }
      
      score += 1 * level;
      clicks += 1;

      // Track click in database
      db.ref('analytics/clicks').push({
        userId: userId,
        timestamp: Date.now()
      });

      // Update counter bounce effect
      const counterEl = document.getElementById('counter');
      counterEl.classList.add('bounce');
      setTimeout(() => counterEl.classList.remove('bounce'), 200);

      updateUI();
      savePlayerData();
    }

    function watchAd() {
      score += 50;
      db.ref('analytics/ads').push({ userId: userId, reward: 50, timestamp: Date.now() });
      updateUI();
      savePlayerData();
      alert('Спасибо за просмотр! +50 токенов.');
    }

    function buyBooster(boosterName, cost) {
      if (score < cost) {
        alert('Недостаточно токенов!');
        return;
      }
      score -= cost;
      
      // Track First Upgrade Time if not tracked
      if (!firstUpgradeTime) {
        firstUpgradeTime = Date.now();
        const timeToFirst = firstClickTime ? Math.round((firstUpgradeTime - firstClickTime) / 1000) : 10;
        db.ref('analytics/upgrades').push({
          userId: userId,
          time_to_first_upgrade: timeToFirst,
          timestamp: Date.now()
        });
      }

      // Track Booster usage/purchase
      db.ref('analytics/boosters').push({
        userId: userId,
        name: boosterName,
        timestamp: Date.now()
      });

      level += 1;
      updateUI();
      savePlayerData();
      alert(`Вы купили ${boosterName}! Ваш уровень повысился!`);
    }

    function useAutoclicker() {
      db.ref(`analytics/autoclicker/${userId}/usage_count`).transaction(c => (c || 0) + 1);
      db.ref(`analytics/autoclicker/${userId}/timestamp`).set(Date.now());
    }

    function playMinigame(gameName) {
      db.ref('analytics/minigames').push({
        userId: userId,
        name: gameName,
        timestamp: Date.now()
      });

      let win = Math.random() > 0.5;
      if (win) {
        score += 100;
        alert(`Игра: ${gameName}. Вы выиграли 100 токенов!`);
      } else {
        alert(`Игра: ${gameName}. Вы не угадали, попробуйте еще раз!`);
      }
      updateUI();
      savePlayerData();
    }

    function claimHourlyBonus() {
      crystals += 5;
      score += 200;
      db.ref('analytics/hourly_bonus').push({ userId: userId, timestamp: Date.now() });
      document.getElementById('bonusMessage').textContent = "+5 💎 и +200 🪙 получено!";
      setTimeout(() => { document.getElementById('bonusMessage').textContent = ""; }, 3000);
      updateUI();
      savePlayerData();
    }

    function togglePanel(panelId) {
      const panel = document.getElementById(panelId);
      if (panel) {
        panel.classList.toggle('open');
      }
    }

    function updateUI() {
      document.getElementById('counter').textContent = score.toLocaleString() + ' 🪙';
      document.getElementById('userLevel').textContent = level;
      document.getElementById('userCrystals').textContent = crystals;
      document.getElementById('userClicks').textContent = clicks;

      // Render Shop items if open
      const shop = document.getElementById('autoclickerShop');
      if (shop) {
        shop.innerHTML = `
          <div class="booster-card">
            <h3>Ускоритель I</h3>
            <div class="price">500 🪙</div>
            <button class="click-button" onclick="buyBooster('Ускоритель I', 500)">Купить</button>
          </div>
          <div class="booster-card premium">
            <h3>Автокликер PRO</h3>
            <div class="price">1500 🪙</div>
            <button class="click-button" onclick="buyBooster('Автокликер PRO', 1500); useAutoclicker();">Купить</button>
          </div>
        `;
      }
    }

    // On Load Startup Operations
    window.addEventListener('DOMContentLoaded', () => {
      trackVisit();
      trackTechnicalMetrics();
      trackGeography();
      setupPresenceAndSession();
      initUserData();
    });
  </script>
</body>
</html>
