  <script>
    // ===== ВЕСЬ КОД ИЗ РАБОЧЕГО ФАЙЛА (мультиязычность, авторизация, кликер, бустеры, задания, реклама) =====
    // ... весь существующий код ...

    // ===== ДОБАВЛЕННЫЙ КОД МАЙНИНГ-СИСТЕМЫ =====
    const RIG_TYPES = {
      cpu: { name: 'CPU Miner', speed: 0.1, energy: 1, costTokens: 100, costCrystals: 0, icon: '🖥️', color: '#6b7280' },
      gpu: { name: 'GPU Rig', speed: 0.4, energy: 3, costTokens: 2000, costCrystals: 5, icon: '🎮', color: '#2563eb' },
      asic: { name: 'ASIC Miner', speed: 1.5, energy: 8, costTokens: 20000, costCrystals: 50, icon: '🔥', color: '#dc2626' },
      quantum: { name: 'Quantum Rig', speed: 5.0, energy: 20, costTokens: 100000, costCrystals: 200, icon: '💎', color: '#9333ea' }
    };

    let energy = 50, maxEnergy = 50;
    let warehouseTokens = 0, warehouseLimit = 12;
    let farmSlots = [
      { type: 'cpu', level: 1, overclock: 0, efficiency: 0, luck: 0, merged: false, overheated: false, overheatEnd: 0, calibrateEnd: 0 },
      null, null, null, null, null
    ];
    const slotUnlockLevels = [1, 2, 3, 5, 7, 10];
    let selectedRigSlot = -1;
    let farmTickInterval = null;
    let energyRegenInterval = null;

    function startFarmSystem() {
      if (farmTickInterval) clearInterval(farmTickInterval);
      if (energyRegenInterval) clearInterval(energyRegenInterval);
      farmTickInterval = setInterval(farmTick, 60000); // каждую минуту
      energyRegenInterval = setInterval(() => {
        if (!user) return;
        energy = Math.min(maxEnergy, energy + 1);
        savePlayerData();
        updateFarmUI();
      }, 300000); // каждые 5 минут
    }

    function farmTick() {
      if (!user) return;
      const now = Date.now();
      let totalIncome = 0, totalEnergyCost = 0;

      for (let i = 0; i < farmSlots.length; i++) {
        const slot = farmSlots[i];
        if (!slot) continue;
        if (slot.overheated && slot.overheatEnd > now) continue;
        if (slot.calibrateEnd && slot.calibrateEnd > now) continue;

        const rig = RIG_TYPES[slot.type];
        if (!rig) continue;

        const sameTypeCount = farmSlots.filter(s => s && s.type === slot.type).length;
        const slotIndex = farmSlots.filter((s, idx) => s && s.type === slot.type).indexOf(slot);
        const dimReturn = Math.max(0.5, 1 - slotIndex * 0.1);
        const overclockBonus = 1 + (slot.overclock || 0) * 0.1;
        const mergeBonus = slot.merged ? 1.4 : 1;
        const efficiencyReduction = 1 - (slot.efficiency || 0) * 0.1;

        totalIncome += rig.speed * dimReturn * overclockBonus * mergeBonus;
        totalEnergyCost += rig.energy * efficiencyReduction;

        // Проверка перегрева
        if ((slot.overclock || 0) >= 4 && Math.random() < 0.05) {
          slot.overheated = true;
          slot.overheatEnd = now + 600000;
        }
      }

      if (energy >= totalEnergyCost) {
        energy -= totalEnergyCost;
        warehouseTokens += totalIncome;
      } else {
        const ratio = energy / Math.max(totalEnergyCost, 0.01);
        energy = 0;
        warehouseTokens += totalIncome * ratio;
      }
      if (warehouseTokens > warehouseLimit) warehouseTokens = warehouseLimit;

      savePlayerData();
      updateFarmUI();
    }

    function collectWarehouse() {
      if (!user || warehouseTokens <= 0) return;
      const amount = Math.floor(warehouseTokens);
      score += amount;
      warehouseTokens = 0;
      savePlayerScore();
      updateCounterDisplay();
      updateProfilePanel();
      updateFarmUI();
      showMessage('✅ +' + amount + ' tokens!');
      updateTaskProgress("collectTokens", amount);
    }

    function getFarmIncomePerMin() {
      let total = 0;
      for (let slot of farmSlots) {
        if (!slot || slot.overheated) continue;
        if (slot.calibrateEnd && slot.calibrateEnd > Date.now()) continue;
        const rig = RIG_TYPES[slot.type];
        const sameType = farmSlots.filter(s => s && s.type === slot.type);
        const idx = sameType.indexOf(slot);
        const dimReturn = Math.max(0.5, 1 - idx * 0.1);
        const ocBonus = 1 + (slot.overclock || 0) * 0.1;
        const mergeBonus = slot.merged ? 1.4 : 1;
        total += rig.speed * dimReturn * ocBonus * mergeBonus;
      }
      return total;
    }

    function getFarmEnergyPerHour() {
      let total = 0;
      for (let slot of farmSlots) {
        if (!slot) continue;
        const rig = RIG_TYPES[slot.type];
        total += rig.energy * (1 - (slot.efficiency || 0) * 0.1);
      }
      return total;
    }

    function updateFarmUI() {
      const income = getFarmIncomePerMin();
      const energyCost = getFarmEnergyPerHour();
      const timeToStop = energyCost > 0 ? (energy / energyCost) : 999;

      document.getElementById('farmEnergyDisplay').textContent = Math.floor(energy) + ' / ' + maxEnergy + ' ⚡';
      const energyPct = (energy / maxEnergy) * 100;
      const bar = document.getElementById('farmEnergyBar');
      bar.style.width = energyPct + '%';
      bar.className = 'energy-fill ' + (energyPct > 50 ? 'high' : energyPct > 20 ? 'med' : 'low');

      document.getElementById('farmWarehouseDisplay').textContent = Math.floor(warehouseTokens) + ' / ' + warehouseLimit + ' 🪙';
      document.getElementById('collectWarehouseBtn').disabled = warehouseTokens <= 0;
      document.getElementById('farmIncomeMin').textContent = income.toFixed(2);
      document.getElementById('farmEnergyHour').textContent = energyCost.toFixed(1);
      document.getElementById('farmTimeToStop').textContent = timeToStop >= 999 ? '∞' : timeToStop.toFixed(1) + 'h';

      renderFarmGrid();
    }

    function renderFarmGrid() {
      const grid = document.getElementById('farmGrid');
      grid.innerHTML = '';
      const playerLevel = getPlayerLevel();

      for (let i = 0; i < 6; i++) {
        const slot = farmSlots[i];
        const div = document.createElement('div');

        if (!slot && playerLevel < slotUnlockLevels[i]) {
          div.className = 'farm-slot locked';
          div.innerHTML = '<span class="slot-number">#' + (i+1) + '</span><span class="slot-lock">🔒</span><div style="font-size:12px;color:#555;">Locked</div><div style="font-size:10px;color:#444;">Lv.' + slotUnlockLevels[i] + '</div>';
        } else if (!slot) {
          div.className = 'farm-slot';
          div.onclick = () => buyRig(i);
          div.innerHTML = '<span class="slot-number">#' + (i+1) + '</span><div style="font-size:12px;color:#555;">Empty Slot</div><div style="font-size:10px;color:#444;">Click to buy</div>';
        } else {
          const rig = RIG_TYPES[slot.type];
          const isOverheated = slot.overheated && slot.overheatEnd > Date.now();
          const isCalibrating = slot.calibrateEnd && slot.calibrateEnd > Date.now();
          let className = 'farm-slot occupied';
          if (isOverheated) className += ' overheated';
          else if (isCalibrating) className += ' calibrating';
          if (slot.merged) className += ' merged';
          div.className = className;
          div.onclick = () => showRigDetail(i);

          let html = '<span class="slot-number">#' + (i+1) + '</span>';
          if (slot.merged) html += '<span class="merge-badge">M</span>';

          if (isOverheated) {
            html += '<div class="overheat-overlay"><span class="overheat-text">OVERHEAT</span></div>';
            html += '<div style="font-size:24px;opacity:0.4;">' + rig.icon + '</div>';
            html += '<div class="rig-name" style="color:#ff4444;">' + rig.name + '</div>';
            html += '<div class="rig-stopped">STOPPED</div>';
          } else if (isCalibrating) {
            const mins = Math.ceil((slot.calibrateEnd - Date.now()) / 60000);
            html += '<div style="font-size:24px;opacity:0.5;">' + rig.icon + '</div>';
            html += '<div class="rig-name">' + rig.name + '</div>';
            html += '<div class="rig-calibrating">' + mins + 'm left</div>';
          } else {
            const sameType = farmSlots.filter(s => s && s.type === slot.type);
            const idx = sameType.indexOf(slot);
            const dimReturn = Math.max(0.5, 1 - idx * 0.1);
            const ocBonus = 1 + (slot.overclock || 0) * 0.1;
            const mergeBonus = slot.merged ? 1.4 : 1;
            const actualSpeed = (rig.speed * dimReturn * ocBonus * mergeBonus).toFixed(2);
            const actualEnergy = (rig.energy * (1 - (slot.efficiency || 0) * 0.1)).toFixed(1);
            const heatPct = Math.min(100, ((slot.overclock || 0) / 10) * 100);
            const fanClass = slot.type === 'cpu' ? 'fan-spin-slow' : slot.type === 'gpu' ? 'fan-spin' : 'fan-spin-fast';

            html += '<svg class="rig-svg" viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="32" height="32" rx="4" stroke="' + rig.color + '" stroke-width="2"/><rect x="14" y="14" width="20" height="20" rx="2" stroke="' + rig.color + '" stroke-width="1.5"/><circle cx="24" cy="24" r="6" stroke="' + rig.color + '" stroke-width="1.5"/><line x1="24" y1="18" x2="24" y2="30" stroke="' + rig.color + '" stroke-width="1"/><line x1="18" y1="24" x2="30" y2="24" stroke="' + rig.color + '" stroke-width="1"/><g class="' + fanClass + '" style="transform-origin:38px 38px;"><circle cx="38" cy="38" r="4" stroke="' + rig.color + '" stroke-width="1.5" fill="none"/><line x1="38" y1="34" x2="38" y2="42" stroke="' + rig.color + '" stroke-width="1.5"/><line x1="34" y1="38" x2="42" y2="38" stroke="' + rig.color + '" stroke-width="1.5"/></g></svg>';
            html += '<div class="rig-name">' + rig.name + (slot.merged ? '+' : '') + '</div>';
            html += '<div class="rig-speed">' + actualSpeed + '/min</div>';
            html += '<div class="rig-energy">' + actualEnergy + ' ⚡/h</div>';
            html += '<div class="heat-bar"><div class="heat-fill ' + (heatPct < 40 ? 'heat-low' : heatPct < 70 ? 'heat-med' : 'heat-high') + '" style="width:' + heatPct + '%"></div></div>';
          }
          div.innerHTML = html;
        }
        grid.appendChild(div);
      }
    }

    function buyRig(index) {
      if (!user) return;
      const rigType = 'cpu'; // Пока можно купить только CPU
      const rig = RIG_TYPES[rigType];
      if (score < rig.costTokens || crystals < rig.costCrystals) {
        showMessage('Need ' + rig.costTokens + ' tokens' + (rig.costCrystals > 0 ? ' + ' + rig.costCrystals + ' 💎' : '') + '!');
        return;
      }
      score -= rig.costTokens;
      crystals -= rig.costCrystals;
      farmSlots[index] = { type: rigType, overclock: 0, efficiency: 0, luck: 0, merged: false, overheated: false, overheatEnd: 0, calibrateEnd: 0 };
      savePlayerData();
      updateCounterDisplay();
      updateProfilePanel();
      updateFarmUI();
      showMessage('🖥️ CPU Miner installed!');
    }

    function showRigDetail(index) {
      selectedRigSlot = index;
      const slot = farmSlots[index];
      if (!slot) return;
      const rig = RIG_TYPES[slot.type];
      const isOverheated = slot.overheated && slot.overheatEnd > Date.now();

      document.getElementById('detailRigIcon').textContent = rig.icon;
      document.getElementById('detailRigName').textContent = rig.name + (slot.merged ? '+' : '');

      const sameType = farmSlots.filter(s => s && s.type === slot.type);
      const idx = sameType.indexOf(slot);
      const dimReturn = Math.max(0.5, 1 - idx * 0.1);
      const ocBonus = 1 + (slot.overclock || 0) * 0.1;
      const mergeBonus = slot.merged ? 1.4 : 1;
      const actualSpeed = (rig.speed * dimReturn * ocBonus * mergeBonus).toFixed(2);
      const actualEnergy = (rig.energy * (1 - (slot.efficiency || 0) * 0.1)).toFixed(1);
      document.getElementById('detailRigSub').textContent = actualSpeed + '/min · ' + actualEnergy + ' ⚡/h';

      document.getElementById('detailOverclockLevel').textContent = slot.overclock || 0;
      document.getElementById('detailOverclockBonus').textContent = ((slot.overclock || 0) * 10);
      document.getElementById('detailEfficiencyLevel').textContent = slot.efficiency || 0;
      document.getElementById('detailEfficiencyBonus').textContent = ((slot.efficiency || 0) * 10);
      document.getElementById('detailLuckLevel').textContent = slot.luck || 0;
      document.getElementById('detailLuckBonus').textContent = ((slot.luck || 0) * 2);
      document.getElementById('detailRigType').textContent = slot.type.toUpperCase();

      const ocBtn = document.getElementById('btnUpgradeOverclock');
      if ((slot.overclock || 0) >= 10) { ocBtn.textContent = 'MAX'; ocBtn.disabled = true; }
      else { ocBtn.textContent = getOverclockCost(slot.type, slot.overclock || 0) + ' 🪙'; ocBtn.disabled = false; }

      const efBtn = document.getElementById('btnUpgradeEfficiency');
      if ((slot.efficiency || 0) >= 5) { efBtn.textContent = 'MAX'; efBtn.disabled = true; }
      else { efBtn.textContent = getEfficiencyCost(slot.type, slot.efficiency || 0) + ' 🪙'; efBtn.disabled = false; }

      const lkBtn = document.getElementById('btnUpgradeLuck');
      if ((slot.luck || 0) >= 5) { lkBtn.textContent = 'MAX'; lkBtn.disabled = true; }
      else { lkBtn.textContent = getLuckCost(slot.type, slot.luck || 0) + ' 🪙'; lkBtn.disabled = false; }

      const canMerge = !slot.merged && farmSlots.some((s, i) => s && s.type === slot.type && !s.merged && i !== selectedRigSlot);
      document.getElementById('mergeRow').style.display = canMerge ? 'flex' : 'none';
      document.getElementById('repairRow').style.display = isOverheated ? 'flex' : 'none';
      document.getElementById('rigDetailPanel').classList.add('open');
    }

    function getOverclockCost(type, level) {
      if (level >= 10) return 0;
      const base = type === 'cpu' ? 200 : type === 'gpu' ? 500 : type === 'asic' ? 2000 : 10000;
      return Math.floor(base * Math.pow(2.5, level));
    }

    function getEfficiencyCost(type, level) {
      if (level >= 5) return 0;
      const base = type === 'cpu' ? 150 : type === 'gpu' ? 400 : type === 'asic' ? 1500 : 7500;
      return Math.floor(base * Math.pow(3, level));
    }

    function getLuckCost(type, level) {
      if (level >= 5) return 0;
      const base = type === 'cpu' ? 300 : type === 'gpu' ? 800 : type === 'asic' ? 3000 : 15000;
      return Math.floor(base * Math.pow(3, level));
    }

    function upgradeRigOverclock() {
      if (selectedRigSlot < 0) return;
      const slot = farmSlots[selectedRigSlot];
      if (!slot) return;
      const cost = getOverclockCost(slot.type, slot.overclock || 0);
      if (score < cost) { showMessage('Not enough tokens!'); return; }
      score -= cost;
      slot.overclock = (slot.overclock || 0) + 1;
      savePlayerData();
      updateCounterDisplay();
      updateFarmUI();
      showRigDetail(selectedRigSlot);
      showMessage('⚡ Overclock +' + (slot.overclock * 10) + '%!');
    }

    function upgradeRigEfficiency() {
      if (selectedRigSlot < 0) return;
      const slot = farmSlots[selectedRigSlot];
      if (!slot) return;
      const cost = getEfficiencyCost(slot.type, slot.efficiency || 0);
      if (score < cost) { showMessage('Not enough tokens!'); return; }
      score -= cost;
      slot.efficiency = (slot.efficiency || 0) + 1;
      savePlayerData();
      updateCounterDisplay();
      updateFarmUI();
      showRigDetail(selectedRigSlot);
      showMessage('🔋 Efficiency +' + (slot.efficiency * 10) + '%!');
    }

    function upgradeRigLuck() {
      if (selectedRigSlot < 0) return;
      const slot = farmSlots[selectedRigSlot];
      if (!slot) return;
      const cost = getLuckCost(slot.type, slot.luck || 0);
      if (score < cost) { showMessage('Not enough tokens!'); return; }
      score -= cost;
      slot.luck = (slot.luck || 0) + 1;
      savePlayerData();
      updateCounterDisplay();
      updateFarmUI();
      showRigDetail(selectedRigSlot);
      showMessage('🍀 Luck +' + (slot.luck * 2) + '%!');
    }

    function mergeRig() {
      if (selectedRigSlot < 0) return;
      const slot = farmSlots[selectedRigSlot];
      if (!slot || slot.merged) return;
      const partnerIdx = farmSlots.findIndex((s, i) => s && s.type === slot.type && !s.merged && i !== selectedRigSlot);
      if (partnerIdx < 0) return;
      slot.merged = true;
      farmSlots[partnerIdx] = null;
      slot.calibrateEnd = Date.now() + 7200000;
      savePlayerData();
      updateFarmUI();
      document.getElementById('rigDetailPanel').classList.remove('open');
      showMessage('🔗 Merge started! +40% speed');
    }

    function repairRig() {
      if (selectedRigSlot < 0) return;
      const slot = farmSlots[selectedRigSlot];
      if (!slot || !slot.overheated) return;
      if (crystals < 10) { showMessage('Need 10 💎!'); return; }
      crystals -= 10;
      slot.overheated = false;
      slot.overheatEnd = 0;
      savePlayerCrystals();
      updateFarmUI();
      showRigDetail(selectedRigSlot);
      showMessage('🔧 Rig repaired!');
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    // Обновлённая функция startGameAfterAuth
    async function startGameAfterAuth() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('gameSection').style.display = 'block';
      await loadPlayerData(user.uid);
      setupCrossPlatformSync();
      startBonusTimer();
      startOnlineTimer();
      checkWeeklyReset();
      loadAdState();
      updateAdTaskUI();
      checkAdCrystalTaskCompletion();
      startFarmSystem();
      const ref = new URLSearchParams(window.location.search).get('ref');
      if (ref) { saveReferrer(ref); window.history.replaceState({}, document.title, window.location.pathname); }
    }
  </script>
</body>
